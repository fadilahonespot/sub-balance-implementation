server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

database:
  host: "postgres-shard-1"
  port: 5432
  user: "postgres"
  password: "postgres"
  dbname: "sub_balance_shard_1"
  sslmode: "disable"
  max_open_conns: 100
  max_idle_conns: 5
  conn_max_lifetime: 5m
  skip_migrations: true

# Database sharding configuration
sharding:
  enabled: true
  shard_count: 3
  shards:
    - host: "postgres-shard-1"
      port: 5432
      user: "postgres"
      password: "postgres"
      dbname: "sub_balance_shard_1"
      sslmode: "disable"
    - host: "postgres-shard-2"
      port: 5432
      user: "postgres"
      password: "postgres"
      dbname: "sub_balance_shard_2"
      sslmode: "disable"
    - host: "postgres-shard-3"
      port: 5432
      user: "postgres"
      password: "postgres"
      dbname: "sub_balance_shard_3"
      sslmode: "disable"

logging:
  level: "info"
  format: "json"
  output: "stdout"

advisory_lock:
  default_timeout: 8s
  max_retries: 3
  retry_delay: 250ms

sub_balance:
  default_shard_count: 3
  max_shard_count: 10
  rebalance_threshold: 0.01  # 1% threshold for rebalancing
  consistency_check_interval: 300s  # 5 minutes
